name: Publish release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(node -p "require('./package.json').version")"
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build and validate release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          npm run build
          npm test
          npm run build:check
          node --check shift.user.js
          grep -q "^// @version[[:space:]]*$version$" shift.user.js
      - name: Commit verified generated artifacts
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git diff --exit-code -- shift.user.js vendor/exp-core/exp-core.js vendor/exp-core/manifest.json
          else
            git add shift.user.js vendor/exp-core/exp-core.js vendor/exp-core/manifest.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m "Build verified SHIFT ${version} release artifacts"
              git push origin HEAD:main
            fi
          fi
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          awk '
            /^## / { section += 1; if (section > 1) exit }
            { print }
          ' CHANGELOG.md > release-notes.md
          sha256sum shift.user.js > SHA256SUMS
          (cd assets && sha256sum shift-launcher.svg) >> SHA256SUMS
          gh release create "$TAG" shift.user.js assets/shift-launcher.svg SHA256SUMS \
            --target "$(git rev-parse HEAD)" --title "SHIFT $TAG" --notes-file release-notes.md
