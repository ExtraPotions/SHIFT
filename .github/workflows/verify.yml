name: Verify SHIFT

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Core rollout preparer
        run: node --check scripts/prepare-core-release.cjs
      - run: npx playwright install --with-deps chromium
      - name: Verify pinned exp-core
        run: node scripts/verify-exp-core-pin.cjs
      - name: Build userscript
        run: npm run build
      - name: Run regression suite
        run: node --test tests/*.test.cjs
      - name: Verify reproducible build
        run: npm run build:check
